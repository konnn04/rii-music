name: Desktop

# Every push / merge to main builds and publishes the desktop app (like the
# server's release.yml); the desktop branch and pull requests only build.
on:
  push:
    branches: [main, desktop]
    tags: ['desktop-v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# A newer push to the same branch cancels the build still running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Combine VERSION (major.minor) with run_number → e.g. 1.0.57, matching release.yml.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute desktop version
        id: ver
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
            ext: .exe
            artifact_name: desktop-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
            ext: ""
            artifact_name: desktop-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
            ext: ""
            artifact_name: desktop-macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            ext: ""
            artifact_name: desktop-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Build the embedded React app first so the Go sidecar embeds web/dist.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: web
        run: pnpm build

      - name: Build Go sidecar
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p desktop/src-tauri/binaries
          go build \
            -trimpath \
            -ldflags "-s -w -X rii_music/internal/server.Version=${VERSION}" \
            -o "desktop/src-tauri/binaries/rii_music-${{ matrix.target }}${{ matrix.ext }}" \
            .

      - name: Set desktop app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.APP_VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + "\n");
          '

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # Code signing is not enabled yet.
      # Windows: configure Authenticode / Azure Trusted Signing (or bundle.windows.signCommand) when a certificate is available.
      - name: Build Tauri desktop app
        working-directory: desktop
        env:
          # Updater signature (.sig next to each bundle). Secrets: Settings → Secrets → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CI: "true"
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ needs.version.outputs.version }}"
          $target = "${{ matrix.target }}"
          $releaseDir = "desktop/src-tauri/target/$target/release"
          $mainExe = Get-ChildItem -Path $releaseDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notlike "rii_music*" } |
            Select-Object -First 1
          if (-not $mainExe) {
            throw "Could not find built main executable in $releaseDir"
          }

          $stage = "desktop/portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $mainExe.FullName (Join-Path $stage "RiiMusic.exe")
          # Tauri resolves sidecars next to the main executable using the plain binary name.
          Copy-Item "desktop/src-tauri/binaries/rii_music-$target.exe" (Join-Path $stage "rii_music.exe")
          @"
          RiiMusic Portable ($ver)

          Run RiiMusic.exe directly from this folder (keep rii_music.exe in the same directory).
          Note: this package does not require installation, but app data is still stored in
          %LOCALAPPDATA%\RiiMusic (and desktop settings in %APPDATA%\app.riimusic.desktop).
          "@ | Set-Content -Path (Join-Path $stage "portable.txt") -Encoding UTF8

          New-Item -ItemType Directory -Force -Path "desktop/dist" | Out-Null
          $zipPath = "desktop/dist/RiiMusic-$ver-windows-x64-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            desktop/dist/RiiMusic-*-windows-x64-portable.zip
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz

  release:
    needs: [version, build]
    # Publish from main (every merge / push) or from a desktop-v* tag.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/desktop-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files and generate notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( \
            -name '*-setup.exe' -o \
            -name '*.msi' -o \
            -name '*.zip' -o \
            -name '*.dmg' -o \
            -name '*.AppImage' -o \
            -name '*.deb' \
          \) -exec cp -v {} release-files/ \;

          {
            echo "## RiiMusic Desktop ${VERSION}"
            echo ""
            echo "RiiMusic Desktop supports two modes:"
            echo "- **Local mode** (standalone): runs the bundled RiiMusic sidecar locally with no account required; music is stored in your chosen local folder."
            echo "- **Client mode**: connects to an existing self-hosted RiiMusic server through the local sidecar proxy."
            echo ""
            echo "### Files"
            for f in release-files/*; do
              echo "- \`$(basename "$f")\`"
            done
          } > release-body.md

      - name: Updater manifest (latest.json)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPO}/releases/download/desktop-v${VERSION}"
          # One updater bundle per platform: the NSIS installer (Windows), the .app.tar.gz
          # (macOS, renamed per arch since both builds call it RiiMusic.app.tar.gz), the AppImage (Linux).
          entry() { # platform-key artifact-dir pattern new-name
            local f sig
            f=$(find "artifacts/$2" -type f -name "$3" ! -name '*.sig' | head -n1 || true)
            [ -n "$f" ] || return 0
            sig="$f.sig"
            [ -f "$sig" ] || { echo "no signature for $f"; return 0; }
            cp "$f" "release-files/$4"; cp "$sig" "release-files/$4.sig"
            jq -n --arg k "$1" --arg u "$base/$4" --rawfile s "$sig" '{($k): {url: $u, signature: $s}}'
          }
          {
            entry windows-x86_64 desktop-windows-x64 '*-setup.exe' "RiiMusic_${VERSION}_x64-setup.exe"
            entry darwin-aarch64 desktop-macos-arm64 '*.app.tar.gz' "RiiMusic_${VERSION}_aarch64.app.tar.gz"
            entry darwin-x86_64 desktop-macos-x64 '*.app.tar.gz' "RiiMusic_${VERSION}_x64.app.tar.gz"
            entry linux-x86_64 desktop-linux-x64 '*.AppImage' "RiiMusic_${VERSION}_amd64.AppImage"
          } | jq -s --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                 '{version: $v, notes: "RiiMusic Desktop \($v)", pub_date: $d, platforms: (add // {})}' > release-files/latest.json
          cat release-files/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.version.outputs.version }}
          name: RiiMusic Desktop ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release-body.md
          files: release-files/*

      # The app checks this fixed address (the repo's "latest" release is the server's).
      - name: Point desktop-latest at this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: RiiMusic Desktop (latest)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "Update manifest for RiiMusic Desktop. Download installers from the desktop-v releases."
          files: release-files/latest.json
