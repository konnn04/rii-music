name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Run vet + tests first; only build and publish if everything passes.
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rii
          POSTGRES_PASSWORD: rii
          POSTGRES_DB: rii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rii -d rii_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # Combine VERSION (major.minor) with run_number → e.g. 1.0.57.
      - name: Compute release version
        id: ver
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: web
        run: pnpm build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        env:
          TEST_DATABASE_URL: postgres://rii:rii@localhost:5432/rii_test?sslmode=disable
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # Build the web app once so all cross-compiled Go binaries embed web/dist.
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: web
        run: pnpm build

      - name: Cross-compile and package binaries
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          build_target() {
            local goos="$1"
            local goarch="$2"
            local label="$3"
            local ext="$4"
            local archive="$5"
            local name="rii_music-${VERSION}-${label}"
            local bin="${name}${ext}"
            local stage="dist/stage/${name}"

            mkdir -p "$stage"
            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X rii_music/internal/server.Version=${VERSION}" \
              -o "${stage}/${bin}" .
            cp README.md .env.example "$stage/"

            if [ "$archive" = "zip" ]; then
              (cd "$stage" && zip -q "../../${name}.zip" "$bin" README.md .env.example)
            else
              tar -C "$stage" -czf "dist/${name}.tar.gz" "$bin" README.md .env.example
            fi
          }

          build_target linux   amd64 linux-amd64   ""     tar.gz
          build_target linux   arm64 linux-arm64   ""     tar.gz
          build_target windows amd64 windows-amd64 ".exe" zip
          build_target darwin  arm64 macos-arm64   ""     tar.gz
          build_target darwin  amd64 macos-amd64   ""     tar.gz

          rm -rf dist/stage
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: RiiMusic ${{ needs.test.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

  # Build and push the container image to GitHub Container Registry.
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.test.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: VERSION=${{ needs.test.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
