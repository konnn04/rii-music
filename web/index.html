<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0F12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>RiiMusic</title>
    <script>
      try { var t = JSON.parse(localStorage.getItem("rii-theme") || '"dark"'); if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; document.documentElement.dataset.theme = t; } catch (e) {}
      try { var a = JSON.parse(localStorage.getItem("rii-accent") || "null"); if (a) { var d = document.documentElement; d.dataset.accent = ""; d.style.setProperty("--ah", a.h); d.style.setProperty("--as", a.s + "%"); d.style.setProperty("--al", a.light + "%"); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
